default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # AI + việc nhẹ
    - queues: [ default, ai ]
      threads: 3
      processes: 1
      polling_interval: 0.5
    # FFmpeg tốn CPU/RAM: giới hạn số video render song song
    - queues: [ video ]
      threads: 1
      processes: <%= ENV.fetch("VIDEO_RENDER_CONCURRENCY", 1) %>
      polling_interval: 1

development:
  <<: *default

production:
  <<: *default
